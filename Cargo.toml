[package]
name = "my-service-bus-main-node"
version = "2.4.0"
authors = ["amigin <amigin@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

my-service-bus = { tag = "1.1.6", git = "https://github.com/MyJetTools/my-service-bus-sdk.git", features = [
    "tcp_contracts",
    "shared",

] }
my-http-server = { tag = "0.9.0", git = "https://github.com/MyJetTools/my-http-server.git", features = [
    "macros",
    "controllers",
    "static-files",
] }
# my-http-server 0.9.0 moved the HTTP-model derive macros into my-http-utils; the
# code they generate references the `my_http_utils` crate directly, so it must be a
# direct dependency. Pinned to the same tag my-http-server 0.9.0 uses to avoid a duplicate.
my-http-utils = { tag = "0.1.0", git = "https://github.com/MyJetTools/my-http-utils.git", features = [
    "server",
] }


my-tcp-sockets = { tag = "0.1.12", git = "https://github.com/my-jet-tools/my-tcp-sockets.git" }

rust-extensions = { tag = "0.1.5", git = "https://github.com/MyJetTools/rust-extensions.git", features = [
    "with-tokio",
    "base64",
    "vec-maybe-stack",
] }

my-logger = { tag = "1.3.0", git = "https://github.com/MyJetTools/my-logger.git" }


my-grpc-extensions = { tag = "0.7.0", git = "https://github.com/MyJetTools/my-grpc-extensions.git", features = [
    "grpc-client",
] }


mcp-server-middleware = { tag = "0.9.0", git = "https://github.com/my-ai-utils/mcp-server-middleware.git" }
my-ai-agent = { tag = "0.1.0", git = "https://github.com/my-ai-utils/my-ai-agent.git", features = [
    "agent",
] }


tonic = { version = "*" }
tonic-prost = "*"

tokio = { version = "*" }
tokio-util = "*"
chrono = "*"
lazy_static = "*"
serde = { version = "*", features = ["derive"] }
serde_json = "*"
serde_derive = "*"
serde_yaml = "*"
base64 = "*"
md5 = "*"
anyhow = "*"
futures-core = "*"
prost = "*"
prost-types = "*"
tokio-stream = "*"
async-trait = "*"
futures-util = "*"
rand = "*"
sysinfo = "*"
prometheus = "*"
uuid = { version = "*", features = ["serde", "v4"] }
arc-swap = "*"
parking_lot = "*"



# Production runs on Linux only; other platforms (macOS dev builds) use the system allocator.
[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = "*"

# Windows: the node as a native Windows service (src/win_service/), the way my-reverse-proxy runs
# there - `--install` / `--start` / `--uninstall` / `--run-as-service` and `--settings <file>`.
[target.'cfg(windows)'.dependencies]
win-service-host = { tag = "0.2.0", git = "https://github.com/my-jet-tools/win-utils.git" }
# The access lists `--install` checks, the process a release build closes to debuggers, and the
# log file a service writes its console to.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
] }


[build-dependencies]
# No `with-tls`: the proto is compiled from the local copy (see build.rs), so the build script
# downloads nothing and does not pull fl-url in at all.
ci-utils = { git = "https://github.com/MyJetTools/ci-utils.git", tag = "0.1.3" }
